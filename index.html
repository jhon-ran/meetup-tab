<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12c2b3">
<title>Meetup Tab · Riviera Maya Tech Builders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --teal:#12c2b3; --teal-d:#0a8f8a; --deep:#0b2a35; --ink:#10242c; --muted:#5d7176;
  --sand:#f8f1e4; --sand-2:#efe4cf; --card:#fffdf8; --line:#e8dfcd;
  --coral:#ff6f4e; --coral-d:#e85a3a; --sun:#ffc94a; --ok:#178f63; --warn:#c97a12; --bad:#cc3f33;
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}

/* Hero */
.hero{position:relative;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 52px;overflow:hidden;
  background:
    radial-gradient(circle at calc(100% - 44px) 18px,#ffd66b 0 40px,rgba(255,214,107,.32) 41px 60px,transparent 61px),
    linear-gradient(165deg,#1bd4c2 0%,#10a8aa 48%,#0b6a83 100%)}
.hero.compact{padding-bottom:44px}
.hero-inner{max-width:560px;margin:0 auto;position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hero.compact .hero-top{margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-decoration:none;letter-spacing:.03em;text-transform:uppercase}
.brand-mark{width:26px;height:26px;border-radius:8px;background:#fff;color:var(--teal-d);display:grid;place-items:center;font:800 12px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:0}
.hero h1{font-size:clamp(28px,7.6vw,40px);font-weight:800;line-height:1.04}
.hero.compact h1{font-size:clamp(24px,6.4vw,32px)}
.hero-sub{margin:6px 0 0;opacity:.94;font-size:15px}
.hero-actions{display:flex;gap:8px;align-items:center}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:30px;display:block}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;text-decoration:none;font-size:20px;border:0;color:#fff}
.lang{display:flex;background:rgba(11,42,53,.45);border:0;border-radius:999px;padding:3px}
.lang span{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;opacity:.85}
.lang span.on{background:#fff;color:var(--deep);opacity:1}
.status{display:inline-block;font:700 11px 'DM Sans',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;vertical-align:2px;margin-left:4px}
.status.open{background:#fff;color:var(--teal-d)}
.status.closed{background:rgba(11,42,53,.35);color:#fff}

/* Layout */
.wrap{max-width:560px;margin:-12px auto 0;padding:0 16px calc(112px + env(safe-area-inset-bottom));position:relative}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;border:1px solid rgba(232,223,205,.8);box-shadow:0 10px 26px -18px rgba(11,42,53,.45)}
.card h2{font-size:20px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card-head h2{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}
.row > .input{flex:1;min-width:0}
.wrap-row{flex-wrap:wrap}
.link{color:var(--teal-d);font-weight:700;text-decoration:none}
.banner{background:#fff4d6;border:1px solid #f3dd9c;color:#6b4c00;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}

/* Inputs & buttons */
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none;font-size:16px}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,194,179,.18)}
textarea.input{min-height:90px;resize:vertical;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;background:var(--deep);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.teal{background:var(--teal-d)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid #f0c9c4}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn.big{padding:16px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-stack{display:grid;gap:8px;margin-top:12px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-stack > *,.btn-pair > *{min-width:0}
.btn-stack .btn,.btn-pair .btn{white-space:normal;text-align:center;line-height:1.2}

/* Segmented */
.seg{display:flex;background:var(--sand-2);border-radius:14px;padding:4px;margin:0 0 14px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 2px 8px -4px rgba(11,42,53,.4)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#fff;font-size:12px;margin-left:4px}

/* Search + chips */
.searchbar{position:sticky;top:0;z-index:5;background:var(--sand);padding:8px 0 6px;margin:0 -16px 6px;padding-left:16px;padding-right:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--deep)}
.cat-h{font-size:17px;margin:18px 2px 8px;scroll-margin-top:118px;display:flex;align-items:baseline;gap:8px}
.cat-h small{font:500 13px 'DM Sans',system-ui,sans-serif;color:var(--muted)}

/* Menu items */
.items{background:var(--card);border-radius:var(--r);border:1px solid rgba(232,223,205,.8);overflow:hidden}
.item{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:13px 14px;border:0;background:transparent;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active{background:#f3fbfa}
.item-main{flex:1;min-width:0}
.item-name{font-weight:700;display:block}
.item-sub{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.item-price{font:800 16px 'Bricolage Grotesque',sans-serif;white-space:nowrap}
.item-price small{font:500 11px 'DM Sans',system-ui,sans-serif;color:var(--muted);display:block;text-align:right}
.plus{width:30px;height:30px;border-radius:10px;background:#e3f7f5;color:var(--teal-d);display:grid;place-items:center;font-weight:800;flex:none}

/* Pills, stepper, switch */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}
.pill.on{border-color:var(--teal-d);background:#e3f7f5;color:var(--deep)}
.pill[disabled]{opacity:.8}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.stepper button{width:46px;height:44px;border:0;background:transparent;font-size:22px;font-weight:700}
.stepper span{min-width:38px;text-align:center;font:800 18px 'Bricolage Grotesque',system-ui,sans-serif}
.switch-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-weight:700}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--teal-d)}
.switch.on::after{left:23px}

/* Tab lines */
.line{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line-main{flex:1;min-width:0}
.line-name{font-weight:700}
.line-meta{font-size:13px;color:var(--muted)}
.line-amt{font:800 16px 'Bricolage Grotesque',system-ui,sans-serif;white-space:nowrap}
.line.paid .line-name,.line.paid .line-amt{color:var(--muted)}
.x-btn{border:0;background:#f6efe3;color:var(--muted);width:30px;height:30px;border-radius:10px;font-size:16px;flex:none}
.tick{color:var(--ok);font-weight:800}
.totals{margin-top:6px}
.tot-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.tot-row.grand{color:var(--ink);font:800 24px 'Bricolage Grotesque',system-ui,sans-serif;padding-top:10px;border-top:1.5px dashed var(--line);margin-top:6px}

/* Bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--sand) 70%,rgba(248,241,228,0))}
.tabbar button{max-width:528px;margin:0 auto;display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-radius:18px;padding:14px 18px;background:var(--deep);color:#fff;font-weight:700;box-shadow:0 12px 26px -12px rgba(11,42,53,.7)}
.tabbar b{font:800 20px 'Bricolage Grotesque',system-ui,sans-serif}
.tabbar .sub{opacity:.75;font-weight:500;font-size:13px;margin-left:6px}

/* Lists */
.row-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-top:1px solid var(--line);text-decoration:none}
.row-link:first-child{border-top:0}
.chev{font-size:24px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid rgba(232,223,205,.8);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:800 22px 'Bricolage Grotesque',system-ui,sans-serif}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat.hl{background:var(--deep);color:#fff;border-color:var(--deep)}
.stat.hl span{color:rgba(255,255,255,.7)}

/* People (organizer) */
.person{border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person-head{display:flex;width:100%;align-items:center;gap:10px;padding:12px 0;border:0;background:transparent;text-align:left}
.avatar{width:36px;height:36px;border-radius:12px;background:#e3f7f5;color:var(--teal-d);display:grid;place-items:center;font:800 15px 'Bricolage Grotesque',system-ui,sans-serif;flex:none}
.person-body{padding:0 0 12px 46px}
.owe{font:800 16px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--coral-d)}
.settled{font-weight:700;color:var(--ok);font-size:14px}

/* QR */
.qr-card{display:flex;gap:16px;align-items:center}
.qr-box{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);flex:none}
.qr-box img,.qr-box canvas{display:block}
@media (max-width:420px){.qr-card{flex-direction:column;text-align:center}}
.qr-big{display:grid;place-items:center;padding:8px 0}
.qr-big .qr-box{padding:14px}

/* Bars */
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin:8px 0;font-size:14px}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sand-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-d));border-radius:99px}
.recon{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
.recon.ok{background:#e4f6ee;color:var(--ok)}
.recon.warn{background:#fff1dc;color:var(--warn)}
.recon.bad{background:#fde7e4;color:var(--bad)}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(11,42,53,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-title{font-size:24px;margin-bottom:2px}
.sheet .input{margin-top:6px}
.sheet .btn.big{margin-top:18px}

/* Waiter view */
.waiter{padding-top:4px}
.w-kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-d);margin:0}
.waiter h2{font-size:34px;margin:4px 0 12px}
.waiter ul{list-style:none;padding:0;margin:0;font-size:18px}
.waiter li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.waiter .w-total{font:800 36px 'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:space-between;margin-top:12px}

/* Toast */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}
</style>
</head>

/* Normalizes any menu (seed, editor, AI JSON) into a safe shape */
function normalizeMenu(m) {
  if (!m || !Array.isArray(m.categories)) throw new Error('bad menu');
  const seenC = new Set(), seenI = new Set();
  const uniq = (id, set) => { let x = id, n = 2; while (set.has(x)) x = id + '-' + n++; set.add(x); return x; };
  const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? null : +v;
  return { categories: m.categories.map(c => ({
    id: uniq(slug(c.id || c.es || c.en), seenC),
    es: String(c.es || c.en || '').trim() || '—', en: String(c.en || c.es || '').trim() || '—',
    items: (Array.isArray(c.items) ? c.items : []).map(it => {
      const variants = (Array.isArray(it.variants) ? it.variants : []).map(v => ({ es: String(v.es || v.en || '').trim(), en: String(v.en || v.es || '').trim(), price: num(v.price) })).filter(v => v.es && v.price !== null);
      const out = { id: uniq(slug(it.id || it.es || it.en), seenI), es: String(it.es || it.en || '').trim(), en: String(it.en || it.es || '').trim(), price: variants.length ? null : num(it.price) };
      if (variants.length) out.variants = variants;
      const options = (Array.isArray(it.options) ? it.options : []).map(o => String(o).trim()).filter(Boolean);
      if (options.length) out.options = options;
      if (it.note_es) out.note_es = String(it.note_es); if (it.note_en) out.note_en = String(it.note_en);
      return out;
    }).filter(it => it.es && (it.variants || it.price !== null))
  }))};
}

const splitPath = p => p.split('/').filter(Boolean);
function setDeep(obj, dotted, val) { const ks = dotted.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }

function makeLocalStore() {
  const KEY = 'rmtb_tab_demo_v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  let db = load();
  const listeners = new Set();
  const cp = o => o == null ? null : JSON.parse(JSON.stringify(o));
  const notify = () => listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} queueMicrotask(notify); };
  window.addEventListener('storage', e => { if (e.key === KEY) { db = load(); notify(); } });
  const colDocs = col => { const pre = col + '/'; const out = []; for (const k in db) if (k.startsWith(pre) && !k.slice(pre.length).includes('/')) out.push({ id: k.slice(pre.length), ...cp(db[k]) }); return out; };
  return {
    async get(p) { return cp(db[p]); },
    async set(p, d) { db[p] = cp(d); save(); },
    async update(p, patch) { const cur = db[p] || {}; for (const [k, v] of Object.entries(patch)) setDeep(cur, k, cp(v)); db[p] = cur; save(); },
    async add(col, d) { const id = uid(); db[col + '/' + id] = cp(d); save(); return id; },
    async del(p) { delete db[p]; save(); },
    async list(col) { return colDocs(col); },
    onDoc(p, cb) { const fn = () => cb(cp(db[p])); listeners.add(fn); queueMicrotask(fn); return () => listeners.delete(fn); },
    onCol(col, cb) { const fn = () => cb(colDocs(col)); listeners.add(fn); queueMicrotask(fn); return () => listeners.delete(fn); }
  };
}

async function makeFirebaseStore() {
  const v = CONFIG.firebaseVersion;
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`)
  ]);
  const app = initializeApp(CONFIG.firebase);
  const db = fs.getFirestore(app);
  if (CONFIG.useAnonymousAuth) await au.signInAnonymously(au.getAuth(app));
  const d = p => fs.doc(db, ...splitPath(p));
  const c = p => fs.collection(db, ...splitPath(p));
  const fail = err => { console.error(err); toast('⚠️ ' + (err.code || err.message || 'Firebase error')); };
  return {
    async get(p) { const s = await fs.getDoc(d(p)); return s.exists() ? s.data() : null; },
    async set(p, data) { await fs.setDoc(d(p), clean(data)); },
    async update(p, patch) { await fs.updateDoc(d(p), clean(patch)); },
    async add(col, data) { const id = uid(); await fs.setDoc(d(col + '/' + id), clean(data)); return id; },
    async del(p) { await fs.deleteDoc(d(p)); },
    async list(col) { const s = await fs.getDocs(c(col)); return s.docs.map(x => ({ id: x.id, ...x.data() })); },
    onDoc(p, cb) { return fs.onSnapshot(d(p), s => cb(s.exists() ? s.data() : null), fail); },
    onCol(col, cb) { return fs.onSnapshot(c(col), s => cb(s.docs.map(x => ({ id: x.id, ...x.data() }))), fail); }
  };
}

});

/* ============================ domain logic ============================ */
const itemFrom = item => item.variants?.length ? Math.min(...item.variants.map(v => +v.price)) : +item.price;
function orderLabel(o, L = lang) {
  const name = L === 'en' ? (o.name_en || o.name_es) : (o.name_es || o.name_en);
  const variant = L === 'en' ? (o.variant_en || o.variant_es) : (o.variant_es || o.variant_en);
  return [name, variant, o.option].filter(Boolean).join(' · ');
}
function personLines(attId, orders) {
  return orders.filter(o => Array.isArray(o.shares) && o.shares.includes(attId)).map(o => ({
    o, amount: r2(o.unitPrice * o.qty / o.shares.length), paid: !!(o.paid && o.paid[attId])
  }));
}
function personTotals(attId, orders) {
  const lines = personLines(attId, orders);
  return { lines, unpaid: r2(sum(lines.filter(l => !l.paid), l => l.amount)), paid: r2(sum(lines.filter(l => l.paid), l => l.amount)), all: r2(sum(lines, l => l.amount)) };
}
async function payFor({ eventId, att, orders, tipPct, method, by }) {
  const lines = personLines(att.id, orders).filter(l => !l.paid);
  if (!lines.length) return;
  const sub = r2(sum(lines, l => l.amount)), tip = r2(sub * tipPct / 100), now = Date.now();
  await Promise.all(lines.map(l => store.update(`events/${eventId}/orders/${l.o.id}`, { ['paid.' + att.id]: now })));
  await store.add(`events/${eventId}/payments`, { attendeeId: att.id, name: att.name, subtotal: sub, tipPct, tip, total: r2(sub + tip), method, at: now, orderIds: lines.map(l => l.o.id), by });
}
async function undoPayments({ eventId, att, orders, payments }) {
  await Promise.all(orders.filter(o => o.paid && o.paid[att.id]).map(o => store.update(`events/${eventId}/orders/${o.id}`, { ['paid.' + att.id]: null })));
  await Promise.all(payments.filter(p => p.attendeeId === att.id).map(p => store.del(`events/${eventId}/payments/${p.id}`)));
}
function computeSummary(ev, attendees, orders, payments) {
  const total = r2(sum(orders, o => o.unitPrice * o.qty));
  let collected = 0;
  orders.forEach(o => (o.shares || []).forEach(a => { if (o.paid && o.paid[a]) collected += o.unitPrice * o.qty / o.shares.length; }));
  collected = r2(collected);
  const spenders = attendees.filter(a => orders.some(o => (o.shares || []).includes(a.id))).length;
  const items = {}; orders.forEach(o => { const k = o.name_es + (o.variant_es ? ' · ' + o.variant_es : ''); items[k] = items[k] || { es: o.name_es + (o.variant_es ? ' · ' + o.variant_es : ''), en: (o.name_en || o.name_es) + (o.variant_en ? ' · ' + o.variant_en : ''), qty: 0, amount: 0 }; items[k].qty += o.qty; items[k].amount += o.unitPrice * o.qty; });
  const cats = {}; orders.forEach(o => { const k = o.catId || 'custom'; cats[k] = cats[k] || { es: o.cat_es || 'Otro', en: o.cat_en || 'Other', amount: 0 }; cats[k].amount += o.unitPrice * o.qty; });
  const hours = {}; attendees.forEach(a => { if (!a.joinedAt) return; const h = new Date(a.joinedAt).getHours(); hours[h] = (hours[h] || 0) + 1; });
  return {
    attendees: attendees.length, spenders, orders: orders.length, total, collected, outstanding: r2(total - collected),
    tips: r2(sum(payments, p => p.tip)), avg: spenders ? r2(total / spenders) : 0,
    top: Object.values(items).sort((a, b) => b.qty - a.qty || b.amount - a.amount).slice(0, 6).map(x => ({ ...x, amount: r2(x.amount) })),
    byCat: Object.values(cats).sort((a, b) => b.amount - a.amount).map(x => ({ ...x, amount: r2(x.amount) })),
    byHour: Object.entries(hours).map(([h, n]) => ({ h: +h, n })).sort((a, b) => a.h - b.h),
    venueBill: ev.venueBill ?? null
  };
}
function summaryText(ev, s, L) {

  const top = s.top.slice(0, 3).map(x => `${L === 'en' ? x.en : x.es} (${x.qty})`).join(', ');
  return L === 'es'

    : `Riviera Maya Tech Builders × ${ev.venueName}\n${ev.title} · ${ev.date}\n\n• ${s.attendees} attendees (${s.spenders} ordered)\n• ${tt('venueTotal')}: ${money(s.total)} MXN\n• ${tt('avgPerson')}: ${money(s.avg)}\n• ${tt('tips')} recorded: ${money(s.tips)}\n${top ? `• ${tt('topItems')}: ${top}\n` : ''}\nThanks for hosting the community! 🌴 rivieramaya.tech`;
}
function downloadCSV(ev, attendees, orders) {

function itemRow(item, ci, ii) {

function menuListHTML(menu, q) {
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const qq = norm(q).trim();
  const match = it => !qq || norm(it.es + ' ' + (it.en || '') + ' ' + (it.options || []).join(' ')).includes(qq);
  const blocks = (menu?.categories || []).map((c, ci) => {
    const rows = c.items.map((it, ii) => match(it) ? itemRow(it, ci, ii) : '').join('');
    return rows ? `<h3 class="cat-h" id="cat-${c.id}">${esc(nm(c))}${lang === 'en' && c.en !== c.es ? `<small>${esc(c.es)}</small>` : ''}</h3><div class="items">${rows}</div>` : '';
  }).join('');
  return blocks || `<div class="empty">🔎 —</div>`;
}

/* Item picker: used by attendees (for themselves) and by the organizer (for anyone) */
function openPickSheet({ eventId, ev, item, cat, actor, attendees, isOrganizer }) {
  if (ev.status === 'closed' && !isOrganizer) { toast(t('closedEvent')); return; }
  const st = { v: item.variants?.length ? 0 : -1, opt: item.options?.[0] ?? null, qty: 1, split: false, shares: new Set([actor.id]), note: '' };
  const unit = () => st.v >= 0 ? +item.variants[st.v].price : +item.price;
  const render = () => {
    const total = r2(unit() * st.qty), n = st.split ? st.shares.size : 1;
    const secondary = lang === 'en' && item.en !== item.es ? `<p class="muted small" style="margin:4px 0 0">${esc(t('onMenu', { name: item.es }))}</p>` : '';
    const note = nm(item, 'note_') ? `<p class="muted small" style="margin:4px 0 0">${esc(nm(item, 'note_'))}</p>` : '';
    openSheet(`<h3 class="sheet-title">${esc(nm(item))}</h3>${secondary}${note}
      ${item.variants?.length ? `<span class="lbl">${t('size')}</span><div class="pills">${item.variants.map((v, i) => `<button class="pill ${i === st.v ? 'on' : ''}" data-act="pkV" data-i="${i}">${esc(nm(v))} · ${money(v.price)}</button>`).join('')}</div>` : ''}
      ${item.options?.length ? `<span class="lbl">${t('choice')}</span><div class="pills">${item.options.map((o, i) => `<button class="pill ${o === st.opt ? 'on' : ''}" data-act="pkO" data-i="${i}">${esc(o)}</button>`).join('')}</div>` : ''}
      <span class="lbl">${t('qty')}</span><div class="stepper"><button data-act="pkQ" data-d="-1" aria-label="−">−</button><span>${st.qty}</span><button data-act="pkQ" data-d="1" aria-label="+">+</button></div>
      ${attendees.length > 1 ? `<div class="switch-row"><span>${t('split')}</span><button class="switch ${st.split ? 'on' : ''}" data-act="pkS" role="switch" aria-checked="${st.split}" aria-label="${t('split')}"></button></div>
        ${st.split ? `<p class="muted small" style="margin:0 0 8px">${t('splitHint')}</p><div class="pills">${attendees.map(a => `<button class="pill ${st.shares.has(a.id) ? 'on' : ''}" data-act="pkP" data-id="${a.id}" ${a.id === actor.id ? 'disabled' : ''}>${esc(a.name)}${a.id === actor.id && !isOrganizer ? ` (${t('you')})` : ''}</button>`).join('')}</div>` : ''}` : ''}
      <input class="input" id="pk-note" style="margin-top:14px" placeholder="${esc(t('note'))}" value="${esc(st.note)}" maxlength="80">
      <button class="btn coral block big" data-act="pkAdd">${isOrganizer ? esc(t('addFor', { name: actor.name })) : t('addToTab')} · ${money(total)}</button>
      ${n > 1 ? `<p class="center muted small">${t('perPerson', { amt: money(total / n) })}</p>` : ''}`);
  };
  const keepNote = () => { const el = $('#pk-note'); if (el) st.note = el.value; };
  addActs({
    pkV: el => { keepNote(); st.v = +el.dataset.i; render(); },
    pkO: el => { keepNote(); st.opt = item.options[+el.dataset.i]; render(); },
    pkQ: el => { keepNote(); st.qty = Math.max(1, Math.min(50, st.qty + +el.dataset.d)); render(); },
    pkS: () => { keepNote(); st.split = !st.split; render(); },
    pkP: el => { keepNote(); const id = el.dataset.id; if (id === actor.id) return; st.shares.has(id) ? st.shares.delete(id) : st.shares.add(id); render(); },
    pkAdd: async el => {
      keepNote(); el.disabled = true;
      const v = st.v >= 0 ? item.variants[st.v] : null;
      await store.add(`events/${eventId}/orders`, {
        itemId: item.id, catId: cat?.id || 'custom', cat_es: cat?.es || 'Otro', cat_en: cat?.en || 'Other',
        name_es: item.es, name_en: item.en || item.es, variant_es: v?.es || null, variant_en: v?.en || null,
        option: st.opt || null, note: st.note.trim() || null, unitPrice: unit(), qty: st.qty,
        shares: st.split ? [...st.shares] : [actor.id], paid: {}, createdBy: actor.id, byOrganizer: !!isOrganizer, createdAt: Date.now()
      });
      closeSheet(); toast(t('added'));
    }
  });
  render();
}

    chip: el => { const tgt = document.getElementById('cat-' + el.dataset.id); if (tgt) tgt.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    pick: el => { const cat = ev.menu.categories[+el.dataset.c]; openPickSheet({ eventId, ev, item: cat.items[+el.dataset.i], cat, actor: meDoc(), attendees, isOrganizer: false }); },
    custom: () => { if (ev.status === 'closed') { toast(t('closedEvent')); return; } openCustomSheet({ eventId, ev, actor: meDoc(), attendees, isOrganizer: false }); },

        ${open.length ? `<span class="lbl">${t('tip')}</span><div class="pills">${[0, 10, 15, 20].map(p => `<button class="pill ${tp === p ? 'on' : ''}" data-act="tipSel" data-p="${p}">${p}%</button>`).join('')}</div>

        <div class="btn-pair"><button class="btn ghost" data-act="waiter">${t('showWaiter')}</button><button class="btn coral" data-act="pay">${t('iPaid')} ✓</button></div>` : ''}</section>

    aiCopy: () => copyText(AI_PROMPT),
    jsonTools: () => {
      openSheet(`<h3 class="sheet-title">${t('importJson')}</h3><p class="muted small">${t('aiHint')}</p>
        <button class="btn small teal" data-act="aiCopy">${t('aiPrompt')}</button>
        <textarea class="input" id="js-text" style="min-height:260px;margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(JSON.stringify(v.menu || { categories: [] }, null, 2))}</textarea>
        <div class="btn-pair"><button class="btn ghost" data-act="jsCopy">${t('copyLink').replace(/link|enlace/i, 'JSON')}</button><button class="btn coral" data-act="jsApply">${t('applyJson')}</button></div>`);
      addActs({
        jsCopy: () => copyText($('#js-text').value),
        jsApply: async () => {
          let parsed; try { const raw = $('#js-text').value.trim().replace(/^```(?:json)?|```$/g, ''); parsed = normalizeMenu(JSON.parse(raw)); } catch (e) { toast(t('invalidJson')); return; }
          if (!parsed.categories.length) { toast(t('invalidJson')); return; }
          closeSheet(); await saveMenu(parsed);
        }
      });
    }
  });
}

/* ----------------------- event admin (organizer) ----------------------- */
function viewEventAdmin(eventId) {
  if (!requireOrg()) return;
  let ev, attendees, orders, payments, shell = false, openRows = new Set(), lastSummary = '', sumTimer;
  const url = eventUrl(eventId);
  $('#app').innerHTML = `<div id="ea-hero"></div><main class="wrap" id="ea-main"><p class="muted">${t('loading')}</p></main>`;
  cleanups.push(store.onDoc(`events/${eventId}`, d => { ev = d; draw(); }));
  cleanups.push(store.onCol(`events/${eventId}/attendees`, d => { attendees = d.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)); draw(); }));
  cleanups.push(store.onCol(`events/${eventId}/orders`, d => { orders = d.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); draw(); }));
  cleanups.push(store.onCol(`events/${eventId}/payments`, d => { payments = d; draw(); }));
  cleanups.push(() => clearTimeout(sumTimer));
  const att = id => attendees.find(a => a.id === id);

  setActs({
    copyLink: () => copyText(url),
    bigQR: () => { openSheet(`<div class="center"><h3 class="sheet-title">${t('shareQR')}</h3><p class="muted" style="margin:2px 0 0">${t('shareQRes')}</p><div class="qr-big"><div class="qr-box" id="qr-big"></div></div><p class="mono small">${esc(url)}</p><button class="btn ghost block" data-act="closeSheet">${t('close')}</button></div>`); drawQR($('#qr-big'), url, Math.min(300, window.innerWidth - 90)); },
    row: el => { const id = el.dataset.id; openRows.has(id) ? openRows.delete(id) : openRows.add(id); drawPeople(); },
    walkin: () => {
      openSheet(`<h3 class="sheet-title">${t('addWalkin').replace('+ ', '')}</h3><p class="muted small">${t('walkinHint')}</p><label class="lbl" for="wk-name">${t('yourName')}</label><input class="input" id="wk-name" maxlength="40"><button class="btn teal block big" data-act="wkGo">${t('save')}</button>`);
      setTimeout(() => $('#wk-name')?.focus(), 50);
      addActs({ wkGo: async () => { const name = $('#wk-name').value.trim(); if (!name) return; const id = uid(); await store.set(`events/${eventId}/attendees/${id}`, { name, building: null, joinedAt: Date.now(), by: 'organizer' }); openRows.add(id); closeSheet(); } });
    },
    addFor: el => openMenuBrowser(att(el.dataset.id)),
    payFor: el => openPaySheet({ eventId, att: att(el.dataset.id), orders, tipPct: ev.tipDefault ?? 10, isOrganizer: true }),
    waiterFor: el => openWaiterSheet({ att: att(el.dataset.id), orders, tipPct: ev.tipDefault ?? 10 }),
    undoFor: async el => { const a = att(el.dataset.id); if (!confirm(t('undoConfirm', { name: a.name }))) return; await undoPayments({ eventId, att: a, orders, payments }); },
    rmOrder: async el => { if (!confirm(t('deleteConfirm'))) return; await store.del(`events/${eventId}/orders/${el.dataset.id}`); toast(t('removed')); },
    saveBill: async () => { const raw = $('#bill').value; await store.update(`events/${eventId}`, { venueBill: raw === '' ? null : r2(+raw) }); },
    copyES: () => copyText(summaryText(ev, computeSummary(ev, attendees, orders, payments), 'es')),
    copyEN: () => copyText(summaryText(ev, computeSummary(ev, attendees, orders, payments), 'en')),
    csv: () => downloadCSV(ev, attendees, orders),
    refreshMenu: async () => { const v = await store.get('venues/' + ev.venueId); if (!v) return; await store.update(`events/${eventId}`, { menu: v.menu, venueName: v.name }); toast(t('menuRefreshed')); },
    closeEv: async () => { if (!confirm(t('closeConfirm'))) return; await store.update(`events/${eventId}`, { status: 'closed', closedAt: Date.now(), summary: computeSummary(ev, attendees, orders, payments) }); },
    reopenEv: async () => { await store.update(`events/${eventId}`, { status: 'open' }); }
  });

  function openMenuBrowser(a) {
    let q = '';
    const render = () => openSheet(`<h3 class="sheet-title">${esc(t('addFor', { name: a.name }))}</h3>
      <input class="input" id="mb-q" type="search" placeholder="${esc(t('search'))}" value="${esc(q)}" autocomplete="off" style="margin:10px 0 4px">
      <div id="mb-list">${menuListHTML(ev.menu, q)}</div><button class="btn ghost block" style="margin-top:14px" data-act="mbCustom">${t('addCustom')}</button>`);
    render();
    $('#mb-q').addEventListener('input', e => { q = e.target.value; setHTML('#mb-list', menuListHTML(ev.menu, q)); });
    addActs({
      pick: el => { const cat = ev.menu.categories[+el.dataset.c]; closeSheet(); openPickSheet({ eventId, ev, item: cat.items[+el.dataset.i], cat, actor: a, attendees, isOrganizer: true }); },
      mbCustom: () => { closeSheet(); openCustomSheet({ eventId, ev, actor: a, attendees, isOrganizer: true }); }
    });
  }
  function draw() {
    if (ev === undefined || !attendees || !orders || !payments) return;
    if (ev === null) { setHTML('#ea-hero', hero({ title: t('notFound'), back: '#/admin', compact: true })); setHTML('#ea-main', ''); return; }
    setHTML('#ea-hero', hero({ title: esc(ev.title), sub: `${esc(ev.venueName)} · ${fmtDate(ev.date)} ${statusChip(ev)}`, back: '#/admin', compact: true }));
    if (!shell) {
      shell = true;
      setHTML('#ea-main', `${demoBanner()}
        <section class="card qr-card"><div class="qr-box" id="qr"></div><div style="min-width:0"><h2 style="margin-bottom:4px">${t('shareQR')}</h2><p class="mono small muted" style="margin:0 0 10px">${esc(url)}</p>
          <div class="row wrap-row"><button class="btn small" data-act="copyLink">${t('copyLink')}</button><button class="btn small ghost" data-act="bigQR">${t('bigQR')}</button><a class="btn small ghost" href="${esc(url)}" target="_blank" rel="noopener">${t('openAttendee')} ↗</a></div></div></section>
        <div class="stats" id="ea-stats"></div>
        <section class="card"><div class="card-head"><h2>${t('people')}</h2><button class="btn small teal" data-act="walkin">${t('addWalkin')}</button></div><div id="ea-people"></div></section>
        <section class="card"><h2>${t('recon')}</h2><label class="lbl" for="bill">${t('venueBill')}</label><div class="row"><input class="input" id="bill" type="number" inputmode="decimal" placeholder="0" value="${ev.venueBill ?? ''}"><button class="btn" data-act="saveBill">${t('check')}</button></div><div id="ea-recon"></div></section>
        <section class="card"><h2>${t('report')}</h2><div id="ea-report"></div><div class="btn-stack"><button class="btn teal" data-act="copyES">${t('copyES')}</button><div class="btn-pair" style="margin:0"><button class="btn ghost" data-act="copyEN">${t('copyEN')}</button><button class="btn ghost" data-act="csv">${t('csv')}</button></div></div></section>
        <section class="card"><h2>${t('menuTools')}</h2><p class="muted small" style="margin:0 0 10px">${t('menuToolsHint')}</p><div class="row wrap-row"><button class="btn small ghost" data-act="refreshMenu">${t('refreshMenu')}</button><a class="btn small ghost" href="#/admin/venue/${ev.venueId}">${t('editMenu')}</a></div></section>
        <div id="ea-actions"></div>`);
      drawQR($('#qr'), url, 132);
      $('#bill').addEventListener('keydown', e => { if (e.key === 'Enter') ACTS.saveBill(); });
    }
    const s = computeSummary(ev, attendees, orders, payments);
    setHTML('#ea-stats', `<div class="stat hl"><span>${t('claimed')}</span><b>${money(s.total)}</b></div><div class="stat"><span>${t('collected')}</span><b>${money(s.collected)}</b></div><div class="stat"><span>${t('outstanding')}</span><b style="color:${s.outstanding > 0 ? 'var(--coral-d)' : 'var(--ok)'}">${money(s.outstanding)}</b></div><div class="stat"><span>${t('tips')}</span><b>${money(s.tips)}</b></div>`);
    drawPeople();
    drawRecon(s); drawReport(s);
    setHTML('#ea-actions', ev.status === 'open' ? `<button class="btn danger block big" data-act="closeEv">${t('closeEvent')}</button>` : `<button class="btn ghost block big" data-act="reopenEv">${t('reopen')}</button>`);
    // keep a live summary on the event so the Insights tab stays current
    const key = JSON.stringify(s);
    if (key !== lastSummary && key !== JSON.stringify(ev.summary || null)) { lastSummary = key; clearTimeout(sumTimer); sumTimer = setTimeout(() => store.update(`events/${eventId}`, { summary: s }).catch(() => {}), 3000); }
  }
  function drawPeople() {
    if (!attendees.length) { setHTML('#ea-people', `<div class="empty">📱 ${t('shareQR')}</div>`); return; }
    setHTML('#ea-people', attendees.map(a => {
      const tot = personTotals(a.id, orders), isOpen = openRows.has(a.id);
      const right = tot.unpaid > 0 ? `<span class="owe">${money(tot.unpaid)}</span>` : (tot.all > 0 ? `<span class="settled">${t('allPaid')}</span>` : `<span class="muted small">${t('noOrders')}</span>`);
      return `<div class="person"><button class="person-head" data-act="row" data-id="${a.id}" aria-expanded="${isOpen}"><span class="avatar">${esc(initials(a.name))}</span><span style="flex:1;min-width:0"><b>${esc(a.name)}</b>${a.building ? `<span class="item-sub">${esc(a.building)}</span>` : ''}</span>${right}</button>
        ${isOpen ? `<div class="person-body">${tot.lines.map(l => `<div class="line ${l.paid ? 'paid' : ''}"><div class="line-main"><div class="line-name">${esc(orderLabel(l.o))}</div><div class="line-meta">${l.o.qty} × ${money(l.o.unitPrice)}${l.o.shares.length > 1 ? ' · ' + t('splitN', { n: l.o.shares.length }) : ''}</div></div><div class="line-amt">${l.paid ? '<span class="tick">✓</span> ' : ''}${money(l.amount)}</div>${!l.paid ? `<button class="x-btn" data-act="rmOrder" data-id="${l.o.id}" aria-label="${t('delete')}">✕</button>` : ''}</div>`).join('')}
          <div class="row wrap-row" style="margin-top:10px"><button class="btn small teal" data-act="addFor" data-id="${a.id}">${t('addItem')}</button>${tot.unpaid > 0 ? `<button class="btn small coral" data-act="payFor" data-id="${a.id}">${t('markPaid')}</button><button class="btn small ghost" data-act="waiterFor" data-id="${a.id}">${t('waiter')}</button>` : ''}${tot.paid > 0 ? `<button class="btn small ghost" data-act="undoFor" data-id="${a.id}">${t('undoPaid')}</button>` : ''}</div></div>` : ''}</div>`;
    }).join(''));
  }
  function drawRecon(s) {
    if (ev.venueBill === null || ev.venueBill === undefined) { setHTML('#ea-recon', `<p class="muted small" style="margin:10px 0 0">${t('noBill')}</p>`); return; }
    const diff = r2(ev.venueBill - s.total);
    const cls = Math.abs(diff) < 1 ? 'ok' : diff > 0 ? 'bad' : 'warn';
    const msg = Math.abs(diff) < 1 ? t('balanced') : diff > 0 ? t('unclaimed', { amt: money(diff) }) : t('overclaimed', { amt: money(-diff) });
    setHTML('#ea-recon', `<div class="recon ${cls}">${msg}</div><div class="totals" style="margin-top:8px"><div class="tot-row"><span>${t('venueBill')}</span><span>${money(ev.venueBill)}</span></div><div class="tot-row"><span>${t('claimed')}</span><span>${money(s.total)}</span></div><div class="tot-row"><span>${t('collected')}</span><span>${money(s.collected)}</span></div></div>`);
  }
  function drawReport(s) {
    if (!s.orders) { setHTML('#ea-report', `<div class="empty">${t('noOrders')}</div>`); return; }
    const maxCat = Math.max(...s.byCat.map(c => c.amount), 1), maxH = Math.max(...s.byHour.map(h => h.n), 1);
    setHTML('#ea-report', `<div class="stats" style="margin-bottom:6px"><div class="stat"><span>${t('peopleN')}</span><b>${s.attendees}</b></div><div class="stat"><span>${t('avgPerson')}</span><b>${money(s.avg)}</b></div></div>
      <span class="lbl">${t('byCategory')}</span>${s.byCat.map(c => `<div class="bar-row"><span>${esc(nm(c))}</span><b>${money(c.amount)}</b><div class="bar"><i style="width:${(c.amount / maxCat * 100).toFixed(1)}%"></i></div></div>`).join('')}
      <span class="lbl">${t('topItems')}</span>${s.top.map(x => `<div class="tot-row" style="color:var(--ink)"><span>${x.qty} × ${esc(lang === 'en' ? x.en : x.es)}</span><span>${money(x.amount)}</span></div>`).join('')}
      ${s.byHour.length ? `<span class="lbl">${t('arrivals')}</span>${s.byHour.map(h => `<div class="bar-row"><span>${String(h.h).padStart(2, '0')}:00</span><b>${h.n}</b><div class="bar"><i style="width:${(h.n / maxH * 100).toFixed(1)}%"></i></div></div>`).join('')}` : ''}`);
  }
}

/* ============================== router ============================== */
const ROUTES = [
  [/^#?\/?$/, viewHome],
  [/^#\/admin\/?$/, viewAdmin],
  [/^#\/admin\/venue\/([\w-]+)$/, viewVenue],
  [/^#\/admin\/e\/([\w-]+)$/, viewEventAdmin],
  [/^#\/e\/([\w-]+)$/, viewAttendee]
];
function route() {
  cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = [];
  closeSheet(); setActs({});
  const h = location.hash || '#/';
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { fn(...m.slice(1)); window.scrollTo(0, 0); return; } }
  viewHome();
}
window.addEventListener('hashchange', route);

(async () => {
  try { store = DEMO ? makeLocalStore() : await makeFirebaseStore(); }
  catch (e) {
    console.error(e);
    $('#app').innerHTML = hero({ title: 'Firebase ⚠️', sub: esc(e.code || e.message) }) + `<main class="wrap"><section class="card"><p>Check the config in index.html, that Firestore is created, and that Anonymous sign-in is enabled (see SETUP.md).</p></section></main>`;
    return;
  }
  route();
})();
</script>
